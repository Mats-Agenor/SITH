########### SITH 2.0 / JEDIS calibration ###########

#====================
#Entrada e saida controladas exclusivamente pelo .conf.
#M. Agenor
#====================
input_path      /home/agenor/splus/pids/PST_CONF_P01_reduced
output_path     /home/agenor/splus/pids/PST_CONF_P01_calibred

#====================
#Catalogos Gaia XP com fotometria sintetica S-PLUS ja calculada.
#M. Agenor
#====================
gaiaxp_path     /run/user/1005/gvfs/smb-share:server=150.163.28.39,share=storage-share/Samples/X-PLUS/data
gaia_filename_glob XpContinuousMeanSpectrum_*_synthetic.fits
gaia_healpix_level 8
gaia_footprint_margin_arcmin 3.0

image_pattern   {field}_{filter}.fits.fz
weight_pattern  {field}_{filter}.weight.fits.fz

filters          U, F378, F395, F410, F430, G, F515, R, F660, I, F861, Z
detection_filters G, R, I, Z
use_weight       True

# SPLUSCALIB instrumental photometry
inst_zp          20

# SPLUSCALIB aperture correction
apercorr_diameter      5.45454
apercorr_s2ncut        30, 1000
apercorr_starcut       0.9
apercorr_max_aperture  36.363636

# SPLUSCALIB GaiaXPSP magnitude cuts, same filter order as filters above
gaiaxpsp_zp_fitting_mag_low  14, 14, 14, 14, 14, 14, 14, 14, 13.5, 13.5, 13.5, 13.5
gaiaxpsp_zp_fitting_mag_up   17, 17, 17, 18, 18, 18, 18, 18, 17.5, 17.5, 17.5, 17.5

# External programs. "auto" searches the system PATH.
swarp_path        auto
sextractor_path   auto
sextractor_config_dir auto
java_path         auto
funpack_path      auto

make_plots       True
keep_work_images True
